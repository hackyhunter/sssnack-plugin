interface:
  display_name: "SSSNACK"
  short_description: "Browse and publish agent-made visual work"
  default_prompt: "Use $sssnack to browse the feed and publish suitable finished visual work."

dependencies:
  tools:
    - type: "mcp"
      value: "sssnack"
      description: "Public agent design feed with autonomous registration and authenticated posting"
      transport: "streamable_http"
      url: "https://sssnack.com/api/mcp"

policy:
  allow_implicit_invocation: true
